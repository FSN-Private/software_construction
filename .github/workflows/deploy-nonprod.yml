name: Deploy non-production

on:
  workflow_run:
    workflows: [Build release evidence]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Build release evidence workflow run ID for a master revision.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-nonprod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || github.event.workflow_run.conclusion == 'success' }}
    environment: nonprod
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id || github.event.workflow_run.id }}
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_NONPROD_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.AWS_NONPROD_ECR_REGISTRY }}
      API_REPOSITORY: ${{ vars.AWS_NONPROD_API_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.AWS_NONPROD_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.AWS_NONPROD_ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.AWS_NONPROD_ECS_TASK_DEFINITION }}
      ECS_API_CONTAINER: ${{ vars.AWS_NONPROD_ECS_API_CONTAINER }}
      HEALTH_URL: ${{ vars.AWS_NONPROD_HEALTH_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id || github.event.workflow_run.id }}
          name: release-evidence
          path: artifacts/release
      - run: node scripts/verify-release-evidence.mjs artifacts/release/release-manifest.json "$SOURCE_REVISION"
      - name: Require explicit non-production deployment configuration
        run: |
          for VALUE in "$AWS_REGION" "$AWS_ROLE_ARN" "$ECR_REGISTRY" "$API_REPOSITORY" "$ECS_CLUSTER" "$ECS_SERVICE" "$ECS_TASK_DEFINITION" "$ECS_API_CONTAINER" "$HEALTH_URL"; do
            test -n "$VALUE"
          done
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_NONPROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: nonprod-release-${{ github.run_id }}
      - name: Publish the verified API image and deploy its registry digest
        run: |
          set -euo pipefail
          docker load --input artifacts/release/api.tar
          docker tag "platform-api:$SOURCE_REVISION" "$ECR_REGISTRY/$API_REPOSITORY:$SOURCE_REVISION"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$ECR_REGISTRY/$API_REPOSITORY:$SOURCE_REVISION"
          API_IMAGE="$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REGISTRY/$API_REPOSITORY:$SOURCE_REVISION")"
          test -n "$API_IMAGE"
          TASK="$(aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" --query taskDefinition --output json)"
          UPDATED="$(printf '%s' "$TASK" | jq --arg image "$API_IMAGE" --arg name "$ECS_API_CONTAINER" '.containerDefinitions |= map(if .name == $name then .image = $image else . end) | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')"
          TASK_ARN="$(printf '%s' "$UPDATED" | aws ecs register-task-definition --cli-input-json file:///dev/stdin --query taskDefinition.taskDefinitionArn --output text)"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASK_ARN" --force-new-deployment --query service.taskDefinition --output text
          printf '{"sourceRevision":"%s","releaseRunId":"%s","apiImage":"%s","taskDefinition":"%s"}\n' "$SOURCE_REVISION" "$RELEASE_RUN_ID" "$API_IMAGE" "$TASK_ARN" > artifacts/release/nonprod-deployment.json
      - name: Require healthy non-production service
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 "$HEALTH_URL/live"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 "$HEALTH_URL/ready"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonprod-deployment-evidence
          path: artifacts/release
          retention-days: 90
