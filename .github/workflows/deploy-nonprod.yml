name: Deploy non-production

on:
  workflow_run:
    workflows: [Build release evidence]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Build release evidence workflow run ID for a master revision.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-nonprod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || github.event.workflow_run.conclusion == 'success' }}
    environment: nonprod
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id || github.event.workflow_run.id }}
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_NONPROD_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.AWS_NONPROD_ECR_REGISTRY }}
      API_REPOSITORY: ${{ vars.AWS_NONPROD_API_REPOSITORY }}
      WORKER_REPOSITORY: ${{ vars.AWS_NONPROD_WORKER_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.AWS_NONPROD_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.AWS_NONPROD_ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.AWS_NONPROD_ECS_TASK_DEFINITION }}
      ECS_API_CONTAINER: ${{ vars.AWS_NONPROD_ECS_API_CONTAINER }}
      WORKER_SERVICE: ${{ vars.AWS_NONPROD_WORKER_SERVICE }}
      WORKER_TASK_DEFINITION: ${{ vars.AWS_NONPROD_WORKER_TASK_DEFINITION }}
      ECS_WORKER_CONTAINER: ${{ vars.AWS_NONPROD_ECS_WORKER_CONTAINER }}
      HEALTH_URL: ${{ vars.AWS_NONPROD_HEALTH_URL }}
      COGNITO_AUTHORITY: ${{ vars.AWS_NONPROD_COGNITO_AUTHORITY }}
      COGNITO_CLIENT_ID: ${{ vars.AWS_NONPROD_COGNITO_CLIENT_ID }}
      COGNITO_OWNER_USERNAME: ${{ secrets.AWS_NONPROD_COGNITO_OWNER_USERNAME }}
      COGNITO_OWNER_PASSWORD: ${{ secrets.AWS_NONPROD_COGNITO_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id || github.event.workflow_run.id }}
          name: release-evidence
          path: artifacts/release
      - run: node scripts/verify-release-evidence.mjs artifacts/release/release-manifest.json "$SOURCE_REVISION" --require-worker
      - name: Require explicit non-production deployment configuration
        run: |
          for VALUE in "$AWS_REGION" "$AWS_ROLE_ARN" "$ECR_REGISTRY" "$API_REPOSITORY" "$WORKER_REPOSITORY" "$ECS_CLUSTER" "$ECS_SERVICE" "$ECS_TASK_DEFINITION" "$ECS_API_CONTAINER" "$WORKER_SERVICE" "$WORKER_TASK_DEFINITION" "$ECS_WORKER_CONTAINER" "$HEALTH_URL" "$COGNITO_AUTHORITY" "$COGNITO_CLIENT_ID" "$COGNITO_OWNER_USERNAME" "$COGNITO_OWNER_PASSWORD"; do
            test -n "$VALUE"
          done
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_NONPROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: nonprod-release-${{ github.run_id }}
      - name: Publish verified images, migrate, and update both task definitions
        run: |
          set -euo pipefail
          docker load --input artifacts/release/api.tar
          docker load --input artifacts/release/ingest-worker.tar
          docker tag "platform-api:$SOURCE_REVISION" "$ECR_REGISTRY/$API_REPOSITORY:$SOURCE_REVISION"
          docker tag "platform-ingest-worker:$SOURCE_REVISION" "$ECR_REGISTRY/$WORKER_REPOSITORY:$SOURCE_REVISION"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          docker push "$ECR_REGISTRY/$API_REPOSITORY:$SOURCE_REVISION"
          docker push "$ECR_REGISTRY/$WORKER_REPOSITORY:$SOURCE_REVISION"
          API_IMAGE="$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REGISTRY/$API_REPOSITORY:$SOURCE_REVISION")"
          WORKER_IMAGE="$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REGISTRY/$WORKER_REPOSITORY:$SOURCE_REVISION")"
          test -n "$API_IMAGE" && test -n "$WORKER_IMAGE"
          MANIFEST_DIGEST="sha256:$(sha256sum artifacts/release/release-manifest.json | awk '{print $1}')"
          API_TASK="$(aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" --query taskDefinition --output json)"
          WORKER_TASK="$(aws ecs describe-task-definition --task-definition "$WORKER_TASK_DEFINITION" --query taskDefinition --output json)"
          for SETTING in ConnectionStrings__Ingest Ingest__Bucket Ingest__KmsKeyId; do
            printf '%s' "$API_TASK" | jq -e --arg container "$ECS_API_CONTAINER" --arg setting "$SETTING" '.containerDefinitions[] | select(.name == $container) | ((.environment // []) + (.secrets // [])) | any(.name == $setting)' >/dev/null
            printf '%s' "$WORKER_TASK" | jq -e --arg container "$ECS_WORKER_CONTAINER" --arg setting "$SETTING" '.containerDefinitions[] | select(.name == $container) | ((.environment // []) + (.secrets // [])) | any(.name == $setting)' >/dev/null
          done
          RELEASE_ID="$(jq -r .releaseId artifacts/release/release-manifest.json)"
          API_UPDATED="$(printf '%s' "$API_TASK" | jq --arg image "$API_IMAGE" --arg name "$ECS_API_CONTAINER" --arg authority "$COGNITO_AUTHORITY" --arg client "$COGNITO_CLIENT_ID" --arg release "$RELEASE_ID" --arg source "$SOURCE_REVISION" --arg manifest "$MANIFEST_DIGEST" '.containerDefinitions |= map(if .name == $name then .image = $image | .environment = ((.environment // []) | map(select(.name != "Authentication__CognitoAuthority" and .name != "Authentication__CognitoClientId" and .name != "PLATFORM_RELEASE_ID" and .name != "PLATFORM_SOURCE_REVISION" and .name != "PLATFORM_MANIFEST_DIGEST")) + [{name:"Authentication__CognitoAuthority",value:$authority},{name:"Authentication__CognitoClientId",value:$client},{name:"PLATFORM_RELEASE_ID",value:$release},{name:"PLATFORM_SOURCE_REVISION",value:$source},{name:"PLATFORM_MANIFEST_DIGEST",value:$manifest}]) else . end) | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')"
          WORKER_UPDATED="$(printf '%s' "$WORKER_TASK" | jq --arg image "$WORKER_IMAGE" --arg name "$ECS_WORKER_CONTAINER" --arg release "$RELEASE_ID" --arg source "$SOURCE_REVISION" --arg manifest "$MANIFEST_DIGEST" '.containerDefinitions |= map(if .name == $name then .image = $image | .environment = ((.environment // []) | map(select(.name != "PLATFORM_RELEASE_ID" and .name != "PLATFORM_SOURCE_REVISION" and .name != "PLATFORM_MANIFEST_DIGEST")) + [{name:"PLATFORM_RELEASE_ID",value:$release},{name:"PLATFORM_SOURCE_REVISION",value:$source},{name:"PLATFORM_MANIFEST_DIGEST",value:$manifest}]) else . end) | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')"
          API_TASK_ARN="$(printf '%s' "$API_UPDATED" | aws ecs register-task-definition --cli-input-json file:///dev/stdin --query taskDefinition.taskDefinitionArn --output text)"
          WORKER_TASK_ARN="$(printf '%s' "$WORKER_UPDATED" | aws ecs register-task-definition --cli-input-json file:///dev/stdin --query taskDefinition.taskDefinitionArn --output text)"
          PREVIOUS_API_TASK="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)"
          PREVIOUS_WORKER_TASK="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$WORKER_SERVICE" --query 'services[0].taskDefinition' --output text)"
          NETWORK="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$WORKER_SERVICE" --query 'services[0].networkConfiguration' --output json)"
          OVERRIDES="$(jq -cn --arg name "$ECS_WORKER_CONTAINER" '{containerOverrides:[{name:$name,command:["--migrate"]}]}')"
          MIGRATION_TASK="$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE --task-definition "$WORKER_TASK_ARN" --network-configuration "$NETWORK" --overrides "$OVERRIDES" --query 'tasks[0].taskArn' --output text)"
          test -n "$MIGRATION_TASK" && test "$MIGRATION_TASK" != None
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$MIGRATION_TASK"
          test "$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$MIGRATION_TASK" --query "tasks[0].containers[?name=='$ECS_WORKER_CONTAINER'].exitCode | [0]" --output text)" = 0
          jq -n --arg source "$SOURCE_REVISION" --arg releaseRun "$RELEASE_RUN_ID" --arg manifest "$MANIFEST_DIGEST" --arg apiImage "$API_IMAGE" --arg workerImage "$WORKER_IMAGE" --arg apiTask "$API_TASK_ARN" --arg workerTask "$WORKER_TASK_ARN" --arg previousApiTask "$PREVIOUS_API_TASK" --arg previousWorkerTask "$PREVIOUS_WORKER_TASK" --arg migrationTask "$MIGRATION_TASK" --arg authority "$COGNITO_AUTHORITY" --arg client "$COGNITO_CLIENT_ID" '{sourceRevision:$source,releaseRunId:$releaseRun,manifestDigest:$manifest,apiImage:$apiImage,workerImage:$workerImage,taskDefinition:$apiTask,workerTaskDefinition:$workerTask,previousTaskDefinition:$previousApiTask,previousWorkerTaskDefinition:$previousWorkerTask,migrationTask:$migrationTask,cognitoAuthority:$authority,cognitoClientId:$client}' > artifacts/release/nonprod-deployment.json
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WORKER_SERVICE" --task-definition "$WORKER_TASK_ARN" --force-new-deployment --query service.taskDefinition --output text
          if ! aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$API_TASK_ARN" --force-new-deployment --query service.taskDefinition --output text; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WORKER_SERVICE" --task-definition "$PREVIOUS_WORKER_TASK" --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$WORKER_SERVICE"
            exit 1
          fi
      - name: Require healthy non-production service
        run: |
          set -euo pipefail
          rollback() {
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$(jq -r .previousTaskDefinition artifacts/release/nonprod-deployment.json)" --force-new-deployment >/dev/null
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WORKER_SERVICE" --task-definition "$(jq -r .previousWorkerTaskDefinition artifacts/release/nonprod-deployment.json)" --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" "$WORKER_SERVICE"
          }
          if ! aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" "$WORKER_SERVICE"; then rollback; exit 1; fi
          if ! curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 "$HEALTH_URL/live"; then rollback; exit 1; fi
          if ! ID_TOKEN="$(aws cognito-idp initiate-auth --auth-flow USER_PASSWORD_AUTH --client-id "$COGNITO_CLIENT_ID" --auth-parameters "USERNAME=$COGNITO_OWNER_USERNAME,PASSWORD=$COGNITO_OWNER_PASSWORD" --query 'AuthenticationResult.IdToken' --output text)"; then rollback; exit 1; fi
          if test -z "$ID_TOKEN" || test "$ID_TOKEN" = None; then rollback; exit 1; fi
          if ! curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 --header "Authorization: Bearer $ID_TOKEN" "$HEALTH_URL/ready" >/dev/null; then rollback; exit 1; fi
          if ! INGEST_SMOKE_TOKEN="$ID_TOKEN" node scripts/smoke-ingest.mjs "$HEALTH_URL" > artifacts/release/ingest-smoke.json; then rollback; exit 1; fi
          jq --slurpfile smoke artifacts/release/ingest-smoke.json '. + {smoke:$smoke[0]}' artifacts/release/nonprod-deployment.json > artifacts/release/nonprod-deployment.tmp
          mv artifacts/release/nonprod-deployment.tmp artifacts/release/nonprod-deployment.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonprod-deployment-evidence
          path: artifacts/release
          retention-days: 90
