name: Independent recovery drill

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 1 1,4,7,10 *'

permissions:
  contents: read

concurrency:
  group: independent-recovery-drill
  cancel-in-progress: false

jobs:
  drill:
    if: ${{ github.repository == 'FSN-Private/software_construction' && github.ref == 'refs/heads/master' && vars.RECOVERY_DRILL_ENABLED == 'true' }}
    environment: recovery-drill
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AWS_REGION: ap-southeast-2
      PRIMARY_ACCOUNT_ID: ${{ vars.RECOVERY_PRIMARY_ACCOUNT_ID }}
      RECOVERY_ACCOUNT_ID: ${{ vars.RECOVERY_ACCOUNT_ID }}
      RECOVERY_ROLE_ARN: ${{ vars.RECOVERY_DRILL_ROLE_ARN }}
      RECOVERY_CLUSTER_ARN: ${{ vars.RECOVERY_CLUSTER_ARN }}
      RECOVERY_TASK_DEFINITION_ARN: ${{ vars.RECOVERY_DRILL_TASK_DEFINITION_ARN }}
      RECOVERY_CONTAINER_NAME: ${{ vars.RECOVERY_DRILL_CONTAINER_NAME }}
      RECOVERY_WORKER_DIGEST: ${{ vars.RECOVERY_WORKER_DIGEST }}
      RECOVERY_SUBNET_IDS: ${{ vars.RECOVERY_ISOLATED_SUBNET_IDS }}
      RECOVERY_SECURITY_GROUP_IDS: ${{ vars.RECOVERY_DRILL_SECURITY_GROUP_IDS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate protected drill configuration before requesting credentials
        run: node --input-type=module -e "import { drillConfiguration } from './scripts/run-recovery-drill.mjs'; drillConfiguration();"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.RECOVERY_DRILL_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: ${{ vars.RECOVERY_ACCOUNT_ID }}
          role-session-name: recovery-drill-${{ github.run_id }}
          role-duration-seconds: 21600
      - name: Launch and observe the fixed isolated recovery drill
        run: node scripts/run-recovery-drill.mjs
      - name: Preserve launch state without exporting protected recovery objects
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-drill-launch
          path: recovery-drill-launch.json
          if-no-files-found: ignore
          retention-days: 90
