name: Roll back compatible production release

on:
  workflow_dispatch:
    inputs:
      production_promotion_run_id:
        description: Successful production-promotion evidence workflow run ID for the known compatible healthy release.
        required: true
        type: string
      compatible_task_definition:
        description: Exact prior healthy API task-definition ARN; never a tag or rebuild instruction.
        required: true
        type: string
      compatible_worker_task_definition:
        description: Exact prior healthy worker task-definition ARN; never a tag or rebuild instruction.
        required: true
        type: string
      reason:
        description: Incident or validation failure reference.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-promotion
  cancel-in-progress: false

jobs:
  rollback:
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
      ECS_CLUSTER: ${{ vars.AWS_PRODUCTION_ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.AWS_PRODUCTION_ECS_SERVICE }}
      WORKER_SERVICE: ${{ vars.AWS_PRODUCTION_WORKER_SERVICE }}
      HEALTH_URL: ${{ vars.AWS_PRODUCTION_HEALTH_URL }}
      COGNITO_CLIENT_ID: ${{ vars.AWS_PRODUCTION_COGNITO_CLIENT_ID }}
      COGNITO_OWNER_USERNAME: ${{ secrets.AWS_PRODUCTION_COGNITO_OWNER_USERNAME }}
      COGNITO_OWNER_PASSWORD: ${{ secrets.AWS_PRODUCTION_COGNITO_OWNER_PASSWORD }}
      COMPATIBLE_TASK_DEFINITION: ${{ inputs.compatible_task_definition }}
      COMPATIBLE_WORKER_TASK_DEFINITION: ${{ inputs.compatible_worker_task_definition }}
      ROLLBACK_REASON: ${{ inputs.reason }}
      PROMOTION_RUN_ID: ${{ inputs.production_promotion_run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.production_promotion_run_id }}
          name: production-promotion-evidence
          path: artifacts/production
      - name: Refuse an incompatible or unverifiable rollback
        run: |
          set -euo pipefail
          SOURCE_REVISION="$(jq -r .sourceRevision artifacts/production/release-manifest.json)"
          node scripts/verify-release-evidence.mjs artifacts/production/release-manifest.json "$SOURCE_REVISION" --require-worker
          test "$(jq -r '.compatibility.rollbackAllowed' artifacts/production/release-manifest.json)" = true
          test -n "$COMPATIBLE_TASK_DEFINITION" && test -n "$COMPATIBLE_WORKER_TASK_DEFINITION" && test -n "$ROLLBACK_REASON" && test -n "$PROMOTION_RUN_ID"
          test "$(jq -r .taskDefinition artifacts/production/production-promotion.json)" = "$COMPATIBLE_TASK_DEFINITION"
          test "$(jq -r .workerTaskDefinition artifacts/production/production-promotion.json)" = "$COMPATIBLE_WORKER_TASK_DEFINITION"
          test "$(jq -r .sourceRevision artifacts/production/production-promotion.json)" = "$SOURCE_REVISION"
          test "$(jq -r .releaseArtifactDigest artifacts/production/production-promotion.json)" = "$(jq -r '.artifacts[] | select(.name == "api.tar") | .digest' artifacts/production/release-manifest.json)"
          test "$(jq -r .workerReleaseArtifactDigest artifacts/production/production-promotion.json)" = "$(jq -r '.artifacts[] | select(.name == "ingest-worker.tar") | .digest' artifacts/production/release-manifest.json)"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: production-rollback-${{ github.run_id }}
      - name: Restore the exact compatible API and worker task definitions
        run: |
          set -Eeuo pipefail
          for VALUE in "$AWS_REGION" "$AWS_ROLE_ARN" "$ECS_CLUSTER" "$ECS_SERVICE" "$WORKER_SERVICE" "$HEALTH_URL" "$COGNITO_CLIENT_ID" "$COGNITO_OWNER_USERNAME" "$COGNITO_OWNER_PASSWORD"; do test -n "$VALUE"; done
          CURRENT_API_TASK="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)"
          CURRENT_WORKER_TASK="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$WORKER_SERVICE" --query 'services[0].taskDefinition' --output text)"
          RESTORE_CURRENT=0
          restore_current() {
            STATUS=$?
            trap - ERR TERM
            if test "$RESTORE_CURRENT" = 1; then
              set +e
              aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$CURRENT_API_TASK" --force-new-deployment >/dev/null
              aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WORKER_SERVICE" --task-definition "$CURRENT_WORKER_TASK" --force-new-deployment >/dev/null
              timeout 600 aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" "$WORKER_SERVICE"
            fi
            exit "$STATUS"
          }
          trap restore_current ERR INT TERM
          RESTORE_CURRENT=1
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WORKER_SERVICE" --task-definition "$COMPATIBLE_WORKER_TASK_DEFINITION" --force-new-deployment --query service.taskDefinition --output text
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$COMPATIBLE_TASK_DEFINITION" --force-new-deployment --query service.taskDefinition --output text
          timeout 600 aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" "$WORKER_SERVICE"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 "$HEALTH_URL/live" >/dev/null
          ID_TOKEN="$(aws cognito-idp initiate-auth --auth-flow USER_PASSWORD_AUTH --client-id "$COGNITO_CLIENT_ID" --auth-parameters "USERNAME=$COGNITO_OWNER_USERNAME,PASSWORD=$COGNITO_OWNER_PASSWORD" --query 'AuthenticationResult.IdToken' --output text)"
          test -n "$ID_TOKEN" && test "$ID_TOKEN" != None
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 15 --header "Authorization: Bearer $ID_TOKEN" "$HEALTH_URL/ready" >/dev/null
          timeout 120 env INGEST_SMOKE_TOKEN="$ID_TOKEN" node scripts/smoke-ingest.mjs "$HEALTH_URL" > rollback-smoke.json
          jq -n --arg reason "$ROLLBACK_REASON" --arg api "$COMPATIBLE_TASK_DEFINITION" --arg worker "$COMPATIBLE_WORKER_TASK_DEFINITION" --slurpfile smoke rollback-smoke.json '{reason:$reason,restoredTaskDefinition:$api,restoredWorkerTaskDefinition:$worker,smoke:$smoke[0]}' > rollback-record.json
          RESTORE_CURRENT=0
          trap - ERR INT TERM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rollback-evidence
          path: rollback-record.json
          retention-days: 90
