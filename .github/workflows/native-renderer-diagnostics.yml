name: Diagnose native renderer pixels

on:
  push:
    branches: [fix/011-deployment-bootstrap]
    paths:
      - .github/workflows/native-renderer-diagnostics.yml
      - scripts/diagnose-native-renderer.sh
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Build release evidence run containing the renderer to diagnose.
        required: true
        type: string
      source_revision:
        description: Full source SHA bound to that release's manifest and provenance.
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id || '39397523975' }}
      SOURCE_REVISION: ${{ inputs.source_revision || 'acc789ca0a7f16fc140b97a69418a42d84909dbd' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Require a successful default-branch release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || exit 2
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]] || exit 2
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > artifacts-release-run.json
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync('artifacts-release-run.json', 'utf8'));
          if (run.path !== '.github/workflows/build-release.yml' || run.event !== 'workflow_run' || run.head_branch !== 'master' || run.head_sha !== process.env.SOURCE_REVISION || run.conclusion !== 'success') {
            throw new Error('Expected a successful default-branch release build for the requested source.');
          }
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RELEASE_RUN_ID }}
          name: release-evidence
          path: artifacts/release
      - name: Verify the exact release before executing its renderer
        run: node scripts/verify-release-evidence.mjs artifacts/release/release-manifest.json "$SOURCE_REVISION" --require-worker "$GITHUB_REPOSITORY" "$RELEASE_RUN_ID"
      - name: Compare native pixels and libc arithmetic paths
        run: bash scripts/diagnose-native-renderer.sh
      - name: Retain bounded public-corpus diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-renderer-diagnostics
          path: artifacts/native-renderer-diagnostics
          if-no-files-found: ignore
          retention-days: 14
