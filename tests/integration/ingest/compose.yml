services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: ingest
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest-test-only
    ports: ["54329:5432"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ingest-test
      MINIO_ROOT_PASSWORD: ingest-test-only
    ports: ["9000:9000"]
