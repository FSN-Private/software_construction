services:
  postgres:
    image: postgres:18.1-alpine@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_DB: ingest
      POSTGRES_USER: ingest
      POSTGRES_PASSWORD: ingest-test-only
    ports: ["127.0.0.1:${INGEST_POSTGRES_PORT:-54329}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingest -d ingest"]
      interval: 1s
      timeout: 5s
      retries: 30
  s3:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      AWS_DEFAULT_REGION: us-east-1
      RUSTFS_ACCESS_KEY: ingest-test
      RUSTFS_SECRET_KEY: ingest-test-only
      RUSTFS_KMS_ENABLE: "true"
      RUSTFS_KMS_BACKEND: static
      RUSTFS_KMS_DEFAULT_KEY_ID: ingest-test-key
      RUSTFS_KMS_STATIC_SECRET_KEY: ingest-test-key:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    ports: ["127.0.0.1:${INGEST_S3_PORT:-9000}:9000"]
